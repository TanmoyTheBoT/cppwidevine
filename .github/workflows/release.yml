name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: widevine-cpp-${{ github.ref_name }}-windows-x64.zip
            vcpkg_triplet: x64-windows
          - os: ubuntu-latest
            artifact_name: widevine-cpp-${{ github.ref_name }}-linux-x64.tar.gz
            vcpkg_triplet: x64-linux
          - os: macos-latest
            artifact_name: widevine-cpp-${{ github.ref_name }}-macos-x64.tar.gz
            vcpkg_triplet: x64-osx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev protobuf-compiler libprotobuf-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl protobuf

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install openssl:x64-windows protobuf:x64-windows

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=..\vcpkg\scripts\buildsystems\vcpkg.cmake
          cmake --build . --config Release

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p package/include package/lib
          cp -r include/widevine package/include/
          cp build/Release/widevine.lib package/lib/
          cd package && 7z a ../${{ matrix.artifact_name }} .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/include package/lib
          cp -r include/widevine package/include/
          cp build/libwidevine.a package/lib/
          tar czf ${{ matrix.artifact_name }} -C package .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package/include package/lib
          cp -r include/widevine package/include/
          cp build/libwidevine.a package/lib/
          tar czf ${{ matrix.artifact_name }} -C package .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
